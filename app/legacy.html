<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Coral Villa de Mengíbar - iPad</title>

<style>
body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #fafaf7;
    color: #222;
}

.contenedor {
    max-width: 800px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

select {
    width: 100%;
    height: 44px;
    font-size: 16px;
    padding: 5px;
    margin-bottom: 15px;
}

.estado {
    text-align: center;
    padding: 15px;
    color: #666;
}

.error {
    color: #b00000;
}

.titulo-obra {
    text-align: center;
    font-size: 20px;
    margin: 15px 0;
}

.partitura {
    width: 100%;
    text-align: center;
}

.pagina {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto 15px auto;
    background: white;
    border: 1px solid #ddd;
}

.info {
    text-align: center;
    font-size: 12px;
    color: #777;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="contenedor">

    <h1>Coral Villa de Mengíbar</h1>

    <label for="obra">Selecciona una obra:</label>

    <select id="obra">
        <option value="">Cargando obras...</option>
    </select>

    <div id="titulo" class="titulo-obra"></div>

    <div id="estado" class="estado">
        Cargando lista de partituras...
    </div>

    <div id="partitura" class="partitura"></div>

    <div class="info">
        Versión compatible con iPad / iOS 9
    </div>

</div>

<script>
(function () {

    var obras = [];

    var selector = document.getElementById("obra");
    var estado = document.getElementById("estado");
    var partitura = document.getElementById("partitura");
    var titulo = document.getElementById("titulo");


    function cargarLista() {

        var xhr = new XMLHttpRequest();

        xhr.open("GET", "partituras/lista.json", true);

        xhr.onreadystatechange = function () {

            if (xhr.readyState === 4) {

                if (xhr.status === 200 || xhr.status === 0) {

                    try {

                        obras = JSON.parse(xhr.responseText);

                        mostrarLista();

                    } catch (e) {

                        mostrarError(
                            "No se ha podido interpretar la lista de partituras."
                        );

                    }

                } else {

                    mostrarError(
                        "No se ha podido cargar la lista de partituras."
                    );

                }

            }

        };

        xhr.send(null);
    }


    function mostrarLista() {

        var i;
        var opcion;

        selector.innerHTML = "";

        opcion = document.createElement("option");
        opcion.value = "";
        opcion.appendChild(
            document.createTextNode("Selecciona una obra")
        );

        selector.appendChild(opcion);


        for (i = 0; i < obras.length; i++) {

            opcion = document.createElement("option");

            opcion.value = i;

            opcion.appendChild(
                document.createTextNode(obras[i].titulo)
            );

            selector.appendChild(opcion);
        }


        estado.innerHTML =
            "Se han cargado " +
            obras.length +
            " partituras.";

    }


    function cargarObra(indice) {

        var obra;
        var paginas;
        var i;
        var imagen;

        partitura.innerHTML = "";
        titulo.innerHTML = "";


        if (indice === "") {

            estado.innerHTML =
                "Selecciona una obra para visualizar la partitura.";

            return;
        }


        obra = obras[parseInt(indice, 10)];

        if (!obra) {

            mostrarError("No se ha encontrado la obra.");

            return;
        }


        titulo.innerHTML = obra.titulo;

        estado.innerHTML = "Cargando partitura...";


        paginas = obra.paginas;


        if (!paginas || paginas.length === 0) {

            mostrarError(
                "Esta obra no tiene imágenes de la partitura."
            );

            return;
        }


        for (i = 0; i < paginas.length; i++) {

            imagen = document.createElement("img");

            imagen.className = "pagina";

            imagen.src =
                "partituras/" +
                paginas[i];

            imagen.alt =
                obra.titulo +
                " - página " +
                (i + 1);

            partitura.appendChild(imagen);
        }


        estado.innerHTML =
            "Partitura cargada - " +
            paginas.length +
            (paginas.length === 1
                ? " página"
                : " páginas");
    }


    function mostrarError(texto) {

        estado.className = "estado error";
        estado.innerHTML = texto;

    }


    selector.onchange = function () {

        estado.className = "estado";

        cargarObra(this.value);

    };


    cargarLista();

})();
</script>
<button id="pruebaAudio" style="
    width:100%;
    height:50px;
    font-size:18px;
    margin-top:20px;
">
    Probar audio
</button>

<div id="estadoAudio" class="estado"></div>

<script>
document.getElementById("pruebaAudio").onclick = function () {

    var AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) {
        document.getElementById("estadoAudio").innerHTML =
            "Web Audio NO disponible";
        return;
    }

    try {

        var contexto = new AudioContext();

        var osc = contexto.createOscillator();
        var ganancia = contexto.createGain();

        osc.type = "sine";
        osc.frequency.value = 440;

        osc.connect(ganancia);
        ganancia.connect(contexto.destination);

        ganancia.gain.value = 0.2;

        osc.start(0);

        setTimeout(function () {
            osc.stop(0);
        }, 1000);

        document.getElementById("estadoAudio").innerHTML =
            "Web Audio funciona correctamente";

    } catch (e) {

        document.getElementById("estadoAudio").innerHTML =
            "Error de audio: " + e.message;

    }

};
</script>
</body>
</html>
